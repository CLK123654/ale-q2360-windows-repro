name: q2360-windows-repro

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Workflow mode
        required: true
        default: reference
        type: choice
        options:
          - reference
          - verify
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Start PostgreSQL17
        shell: pwsh
        run: |
          $service = Get-Service -Name postgresql-x64-17 -ErrorAction Stop
          Set-Service -Name $service.Name -StartupType Manual
          Start-Service -Name $service.Name
          $psql = Join-Path $env:PGBIN psql.exe
          $ready = Join-Path $env:PGBIN pg_isready.exe
          for ($attempt = 1; $attempt -le 15; $attempt++) {
            & $ready --host=127.0.0.1 --port=5432 --username=postgres
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 2
          }
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL17 unavailable' }
          "PSQL_PATH=$psql" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PGHOST=127.0.0.1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PGPORT=5432" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PGUSER=postgres" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PGPASSWORD=root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PGDATABASE=postgres" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Record Windows host
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $hostInfo = [ordered]@{
            caption = (Get-CimInstance Win32_OperatingSystem).Caption
            version = (Get-CimInstance Win32_OperatingSystem).Version
            build = (Get-CimInstance Win32_OperatingSystem).BuildNumber
            runner_image = $env:ImageOS
            node_version = (node --version)
            commit_sha = $env:GITHUB_SHA
            workflow_run_id = $env:GITHUB_RUN_ID
          }
          $hostInfo | ConvertTo-Json | Set-Content -Encoding utf8NoBOM evidence/windows-host.json
          & $env:PSQL_PATH --version | Set-Content -Encoding utf8NoBOM evidence/postgresql-version.txt
      - name: Generate Reference candidate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'reference' }}
        shell: pwsh
        run: python ./qa/generate_reference.py
      - name: Verify final attachments
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'verify') }}
        shell: pwsh
        run: |
          $pythonPath = (Get-Command python).Source
          New-NetFirewallRule -DisplayName q2360-python-no-external -Direction Outbound -Program $pythonPath -Action Block | Out-Null
          New-NetFirewallRule -DisplayName q2360-psql-no-external -Direction Outbound -Program $env:PSQL_PATH -RemoteAddress Internet -Action Block | Out-Null
          Get-NetFirewallRule -DisplayName q2360-*-no-external | Select-Object DisplayName,Enabled,Direction,Action | ConvertTo-Json | Set-Content -Encoding utf8NoBOM evidence/network-guard.json
          python ./qa/windows_verify.py
      - name: Remove process network guard
        if: always()
        shell: pwsh
        run: Get-NetFirewallRule -DisplayName q2360-*-no-external -ErrorAction SilentlyContinue | Remove-NetFirewallRule
      - name: Upload independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q2360-windows-evidence
          path: evidence/**
          if-no-files-found: error
          retention-days: 1
